name: Release

# Beim Push eines Tags v* (z. B. v1.7.4) wird ein GitHub-Release mit ZIP angelegt.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DirToy.ps1 muss zu src passen
        shell: pwsh
        run: ./build.ps1 -Check

      - name: Version und Signatur muessen stimmen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./src/core/15-signatur.ps1
          . ./src/core/16-signierschluessel.ps1
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $bytes = [IO.File]::ReadAllBytes("$PWD/DirToy.ps1")
          if ([Text.Encoding]::UTF8.GetString($bytes) -notmatch "script:version = '$([regex]::Escape($ver))'") { throw "DirToy.ps1 hat nicht die Version $ver" }
          if (-not (Test-UpdateSignature $bytes (Get-Content -Raw ./DirToy.ps1.sig))) { throw 'DirToy.ps1.sig fehlt oder passt nicht (tools/signieren.ps1)' }

      - name: ZIP bauen
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir "DirToy-$VER"
          cp DirToy.ps1 DirToy.cmd DirToy.ico README.md LICENSE "DirToy-$VER/"
          # Repo speichert LF, Windows-Nutzer bekommen CRLF
          sed -i 's/$/\r/' "DirToy-$VER/DirToy.ps1" "DirToy-$VER/DirToy.cmd" "DirToy-$VER/README.md" "DirToy-$VER/LICENSE"
          zip -r "DirToy-$VER.zip" "DirToy-$VER"

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "DirToy-$VER.zip" \
            --title "DirToy $VER" --generate-notes
